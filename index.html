<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>ToneAudio — Untitled Studio</title>

  <!-- AWS SDK -->
  <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1613.0.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ... (exactly the same CSS as before) ... */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #080b0e;
      --bg-card: #0e1117;
      --bg-input: #141820;
      --border-light: rgba(255, 255, 255, 0.05);
      --border-glow: rgba(255, 255, 255, 0.12);
      --text-main: #eaecef;
      --text-muted: #8a909e;
      --text-dim: #4b5160;
      --accent: #ffffff;
      --accent-soft: rgba(255, 255, 255, 0.07);
      --status-idea: #6c757d;
      --status-wip: #f4c542;
      --status-demo: #4da8e0;
      --status-done: #6fcf97;
      --status-released: #ffffff;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --transition-smooth: 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 25% 35%, rgba(100, 120, 160, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 75% 65%, rgba(140, 110, 170, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: -2;
    }

    .bg-aura {
      position: fixed;
      width: 90vw;
      height: 90vw;
      border-radius: 50%;
      filter: blur(110px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.5;
    }

    .aura-1 { top: -25vh; left: -15vw; background: radial-gradient(circle, rgba(70, 90, 120, 0.3), transparent); }
    .aura-2 { bottom: -30vh; right: -15vw; background: radial-gradient(circle, rgba(130, 100, 160, 0.2), transparent); }

    #app {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: rgba(8, 11, 14, 0.7);
      backdrop-filter: blur(24px);
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      padding: 32px 0 28px;
      z-index: 20;
      transition: transform 0.35s var(--transition-smooth);
    }

    .logo-area {
      padding: 0 28px 32px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 28px;
    }

    .logo-area h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 30%, #b0b8cc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .logo-area span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 6px;
      display: block;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      margin: 2px 10px;
      border-radius: 12px;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-item svg {
      opacity: 0.7;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .nav-item:hover {
      background: var(--accent-soft);
      color: #fff;
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
    }

    .nav-item.active svg {
      opacity: 1;
    }

    .sidebar-projects {
      margin-top: 24px;
      padding: 0 12px;
    }

    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0 12px 12px 12px;
    }

    .project-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      margin: 2px 0;
      border-radius: 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .project-chip:hover {
      background: var(--accent-soft);
      color: white;
    }

    .project-dot {
      width: 9px;
      height: 9px;
      border-radius: 4px;
      background: var(--text-dim);
    }

    .main {
      flex: 1;
      padding: 40px 52px;
      overflow-y: auto;
      min-height: 100vh;
    }

    .page {
      display: none;
      animation: fadeSlide 0.3s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(12px);}
      to { opacity: 1; transform: translateY(0);}
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 36px;
      flex-wrap: wrap;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-light);
    }

    .page-header h2 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: #fff;
    }

    .page-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.85rem;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      backdrop-filter: blur(8px);
    }

    .btn-primary {
      background: white;
      border-color: white;
      color: black;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #e4e6eb;
      transform: scale(0.97);
    }

    .btn-ghost {
      border-color: rgba(255,255,255,0.15);
    }

    .btn-ghost:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.3);
    }

    .btn-danger {
      border-color: rgba(255, 80, 80, 0.25);
      color: #ff9b9b;
    }

    .btn-sm {
      padding: 6px 16px;
      font-size: 0.78rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 24px;
      transition: all 0.25s ease;
      cursor: pointer;
      box-shadow: 0 10px 30px -15px rgba(0,0,0,0.3);
    }

    .card:hover {
      border-color: var(--border-glow);
      transform: translateY(-4px);
      background: #151a22;
      box-shadow: 0 18px 40px -15px rgba(0,0,0,0.5);
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .song-row {
      display: grid;
      grid-template-columns: 28px 1fr 130px 80px 80px 110px;
      gap: 12px;
      align-items: center;
      padding: 14px 22px;
      background: rgba(14, 17, 23, 0.5);
      border-radius: var(--radius-lg);
      border: 1px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
    }

    .song-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 3px;
      background: rgba(255,255,255,0);
      border-radius: 0 3px 3px 0;
      transition: background 0.2s;
    }

    .song-row:hover {
      background: #151a24;
      border-color: rgba(255,255,255,0.08);
      transform: translateX(4px);
    }

    .song-row:hover::before {
      background: rgba(255,255,255,0.2);
    }

    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: 40px;
      text-align: center;
      background: rgba(255,255,255,0.05);
      width: fit-content;
    }

    .status-idea { background: #23262e; color: var(--status-idea); }
    .status-wip { background: #2f301c; color: var(--status-wip); }
    .status-demo { background: #152e3f; color: var(--status-demo); }
    .status-done { background: #172e21; color: var(--status-done); }
    .status-released { background: #2a2e39; color: white; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 48px;
    }

    .stat-card {
      background: rgba(15, 18, 24, 0.7);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-xl);
      padding: 22px 26px;
      border: 1px solid var(--border-light);
    }

    .stat-card-value {
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-card-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: #0e1117;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      width: 100%;
      max-width: 680px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 30px 60px rgba(0,0,0,0.7);
    }

    .modal-header {
      padding: 28px 32px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: rgba(255,255,255,0.05);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
    }

    input, select, textarea {
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      color: white;
      font-family: inherit;
      font-size: 0.9rem;
      width: 100%;
      margin-bottom: 14px;
    }

    textarea {
      resize: vertical;
    }

    .upload-zone {
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: var(--radius-lg);
      padding: 32px;
      text-align: center;
      transition: all 0.2s;
      cursor: pointer;
      background: rgba(255,255,255,0.02);
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #0d1017;
      border-radius: var(--radius-md);
      padding: 14px 20px;
      margin-bottom: 8px;
      border: 1px solid transparent;
      transition: 0.15s;
    }

    .file-row:hover {
      border-color: var(--border-glow);
      background: #12161f;
    }

    /* Custom audio player */
    .player-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: auto;
      min-width: 400px;
      max-width: 90vw;
      background: rgba(10, 13, 18, 0.85);
      backdrop-filter: blur(30px);
      border-radius: 100px;
      padding: 10px 28px;
      display: none;
      align-items: center;
      gap: 20px;
      z-index: 90;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .player-bar.visible { display: flex; }

    .player-art {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #1a1e26;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    .player-info {
      min-width: 0;
    }

    .player-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-sub {
      font-size: 0.75rem;
      opacity: 0.5;
    }

    .player-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px;
      transition: opacity 0.2s;
    }

    .player-btn:hover {
      opacity: 0.7;
    }

    .player-progress {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
      min-width: 100px;
    }

    .player-progress-fill {
      height: 100%;
      background: white;
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .player-time {
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      opacity: 0.6;
      white-space: nowrap;
    }

    #pin-screen {
      position: fixed;
      inset: 0;
      background: #040609;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(30px);
    }

    #pin-screen.hidden { display: none; }

    .pin-logo {
      font-size: 3.5rem;
      font-weight: 600;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }

    .pin-dots {
      display: flex;
      gap: 22px;
      margin: 40px 0;
    }

    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.15);
      transition: all 0.15s;
    }

    .pin-dot.filled {
      background: white;
      transform: scale(1.2);
      box-shadow: 0 0 12px rgba(255,255,255,0.3);
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      gap: 14px;
    }

    .pin-key {
      background: rgba(255,255,255,0.04);
      border-radius: 60px;
      padding: 22px 0;
      text-align: center;
      font-size: 2rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.1s ease;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .pin-key:active {
      background: rgba(255,255,255,0.1);
      transform: scale(0.96);
    }

    @media (max-width: 780px) {
      .sidebar { position: fixed; left: -280px; top: 0; height: 100vh; }
      .sidebar.mobile-open { left: 0; }
      .main { padding: 24px 20px; }
      .stats-row { grid-template-columns: 1fr 1fr; }
      .song-row { grid-template-columns: 28px 1fr; gap: 10px; }
      .song-row .song-project, .song-row .song-key, .song-row .song-bpm { display: none; }
      .player-bar { left: 16px; right: 16px; bottom: 16px; transform: none; width: auto; }
      .hamburger { display: flex; position: fixed; top: 18px; left: 18px; z-index: 100; background: #0e1117; border-radius: 40px; padding: 10px 14px; gap: 7px; border: 1px solid var(--border-light); }
      .hamburger span { width: 20px; height: 2px; background: white; display: block; }
    }

    .hamburger { display: none; cursor: pointer; }
    .toast-container { position: fixed; bottom: 100px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: #1e222b; border-radius: 40px; padding: 12px 22px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(8px); }
  </style>
</head>
<body>
<div id="pin-screen">
  <div class="pin-logo" style="color:white;">TONE</div>
  <div style="font-family: monospace; opacity: 0.4; margin-bottom: 24px; font-size:0.8rem;">untitled studio</div>
  <div class="pin-dots" id="pin-dots-container"></div>
  <div class="pin-keypad" id="pin-keypad"></div>
  <div id="pin-error" style="margin-top: 24px; font-size: 0.8rem; color: #ff8a8a;"></div>
</div>

<div class="bg-aura aura-1"></div><div class="bg-aura aura-2"></div>
<button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo-area"><h1>toneaudio</h1><span>untitled · studio</span></div>
    <div class="nav-item active" data-page="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</div>
    <div class="nav-item" data-page="projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Projects</div>
    <div class="nav-item" data-page="songs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Songs</div>
    <div class="nav-item" data-page="files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Files</div>
    <div class="sidebar-projects" id="sidebarProjectsList"><div class="section-label">PROJECTS</div></div>
  </aside>

  <main class="main">
    <div class="page active" id="page-dashboard"><div class="page-header"><div><h2>Dashboard</h2><p id="dash-date"></p></div></div><div class="stats-row" id="statsRow"></div><div class="recent-activity"><div class="section-label" style="margin-bottom: 18px;">RECENT TRACKS</div><div id="recentList"></div></div></div>
    <div class="page" id="page-projects"><div class="page-header"><div><h2>Projects</h2><p>creative containers</p></div><button class="btn btn-primary" onclick="openProjectModal()">+ New Project</button></div><div class="card-grid" id="projectsGrid"></div></div>
    <div class="page" id="page-songs"><div class="page-header"><div><h2>Songs</h2><p id="songsSub">all works</p></div><button class="btn btn-primary" onclick="openSongModal()">+ New Song</button></div><div class="filters-bar" style="display:flex; gap:12px; margin-bottom: 28px;"><input id="songSearch" placeholder="search tracks..." style="background:var(--bg-input); border-radius:40px; padding:12px 18px;"><select id="filterProjectSelect" style="max-width:180px;"></select><select id="filterStatusSelect" style="max-width:130px;"></select></div><div class="song-list" id="songsListContainer"></div></div>
    <div class="page" id="page-files"><div class="page-header"><div><h2>Files</h2><p>S3 vault</p></div></div><div class="upload-zone" id="globalUploadZone"><input type="file" multiple accept="audio/*" id="globalFileInput"><div style="margin-top:12px;">⬆️ drop or click to upload</div><div class="upload-progress" style="height:3px; background:#1a1e26; margin-top:14px; border-radius:2px;"><div id="globalProgress" style="width:0%;height:100%;background:white;border-radius:2px;"></div></div></div><div class="filters-bar" style="margin:28px 0; display:flex; gap:14px;"><select id="filesProjectFilter"></select><select id="filesSongFilter"></select></div><div id="globalFilesList"></div></div>
  </main>
</div>

<!-- Custom audio player -->
<div class="player-bar" id="playerBar">
  <div class="player-art">🎵</div>
  <div class="player-controls">
    <div class="player-info">
      <div class="player-title" id="playerTitle"></div>
      <div class="player-sub" id="playerSub"></div>
    </div>
    <button class="player-btn" id="playPauseBtn">▶</button>
    <div class="player-progress" id="progressBar">
      <div class="player-progress-fill" id="progressFill"></div>
    </div>
    <span class="player-time" id="timeDisplay">0:00 / 0:00</span>
  </div>
  <button class="player-btn" id="closePlayerBtn">✕</button>
  <audio id="audioPlayer" style="display:none;"></audio>
</div>

<div class="toast-container" id="toastContainer"></div>

<!-- modals -->
<div class="modal-overlay" id="projectModal"><div class="modal"><div class="modal-header"><h3 id="projectModalTitle">New Project</h3><button class="modal-close" onclick="closeModal('projectModal')">✕</button></div><div class="modal-body" style="padding:20px 32px 28px;"><input id="projName" placeholder="Name"><input id="projGenre" placeholder="Genre"><input id="projColor" type="color" value="#ffffff"><textarea id="projNotes" placeholder="Notes..." rows="3"></textarea><div style="display:flex; gap:12px; justify-content:flex-end; margin-top:24px;"><button class="btn btn-ghost" onclick="closeModal('projectModal')">Cancel</button><button class="btn btn-primary" onclick="saveProject()">Save</button></div></div></div></div>
<div class="modal-overlay" id="songModal"><div class="modal"><div class="modal-header"><h3 id="songModalTitle">New Song</h3><button class="modal-close" onclick="closeModal('songModal')">✕</button></div><div class="modal-body" style="padding:20px 32px 28px;"><input id="songTitle" placeholder="Title"><select id="songProjectSelect"></select><select id="songStatusSelect"><option>idea</option><option>wip</option><option>demo</option><option>done</option><option>released</option></select><input id="songBpm" placeholder="BPM"><input id="songKey" placeholder="Key"><textarea id="songLyrics" placeholder="Lyrics" rows="4"></textarea><textarea id="songNotes" placeholder="Notes" rows="2"></textarea><div class="form-actions" style="display:flex; gap:12px; justify-content:flex-end; margin-top:20px;"><button class="btn btn-ghost" onclick="closeModal('songModal')">Cancel</button><button class="btn btn-primary" onclick="saveSong()">Save</button></div></div></div></div>
<div class="modal-overlay" id="songDetailModal"><div class="modal" style="max-width: 720px;"><div class="modal-header"><h3 id="detailTitle"></h3><div><button class="btn btn-ghost btn-sm" id="detailEditBtn">Edit</button><button class="modal-close" onclick="closeModal('songDetailModal')">✕</button></div></div><div class="modal-body" id="songDetailBody" style="padding:20px 32px 28px;"></div></div></div>
<div class="modal-overlay" id="projectDetailModal"><div class="modal"><div class="modal-header"><h3 id="projDetailTitle"></h3><div><button class="btn btn-ghost btn-sm" id="projDetailEditBtn">Edit</button><button class="modal-close" onclick="closeModal('projectDetailModal')">✕</button></div></div><div class="modal-body" id="projectDetailBody" style="padding:20px 32px 28px;"></div></div></div>

<script>
// ----- AWS SDK initialization (unchanged) -----
const awsConfig = window.CONFIG?.aws || {};
AWS.config.update({
  accessKeyId: awsConfig.accessKey,
  secretAccessKey: awsConfig.secretKey,
  region: awsConfig.region
});
const s3 = new AWS.S3({ apiVersion: '2006-03-01', params: { Bucket: awsConfig.bucket } });

// ✅ Changed: store database inside the audio/ prefix where we already have write permission
const DB_KEY = 'audio/_db.json';

// ----- App state -----
let db = { projects: [], songs: [], files: [] };
let editingProjectId = null, editingSongId = null, currentSongId = null, currentProjectId = null;
let currentAudio = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function toast(msg, type='info') {
  const t = document.createElement('div');
  t.className = 'toast';
  if (type === 'error') t.style.background = '#5a2020';
  t.innerText = msg;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ----- S3 operations -----
async function loadFromS3() {
  try {
    const data = await s3.getObject({ Key: DB_KEY }).promise();
    const json = JSON.parse(data.Body.toString('utf-8'));
    db = json;
    toast('Data loaded from vault');
  } catch (e) {
    console.warn('Could not load from S3', e);
  }
  updateUI();
}

async function saveNow() {
  const body = JSON.stringify({ projects: db.projects, songs: db.songs, files: db.files }, null, 2);
  try {
    await s3.putObject({
      Key: DB_KEY,
      Body: body,
      ContentType: 'application/json',
      ACL: 'private'
    }).promise();
    console.log('DB saved successfully');
    return true;
  } catch (e) {
    console.error('Save failed', e);
    toast('⚠️ Failed to update database: ' + e.message, 'error');
    return false;
  }
}

let saveTimer = null;
function saveToS3() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 500);
}

async function uploadFileToS3(file, songId, projectId, progressId) {
  const key = `audio/${projectId || 'global'}/${songId || 'misc'}/${Date.now()}_${file.name}`;
  const upload = s3.upload({
    Key: key,
    Body: file,
    ContentType: file.type || 'audio/mpeg'
  });
  if (progressId) {
    upload.on('httpUploadProgress', (progress) => {
      const pct = Math.round((progress.loaded / progress.total) * 100);
      document.getElementById(progressId).style.width = pct + '%';
    });
  }
  await upload.promise();
  
  const fileRecord = {
    id: uid(),
    songId,
    projectId,
    s3key: key,
    filename: file.name,
    size: file.size,
    uploaded: Date.now()
  };
  db.files.push(fileRecord);
  
  const saved = await saveNow();
  if (!saved) {
    db.files = db.files.filter(f => f.id !== fileRecord.id);
    toast('File uploaded but database update failed', 'error');
    renderFiles();
    if (progressId) document.getElementById(progressId).style.width = '0%';
    return;
  }
  
  toast(`⬆️ ${file.name}`);
}

async function getSignedUrl(key) {
  return s3.getSignedUrl('getObject', { Key: key, Expires: 3600 });
}

async function deleteS3Object(key) {
  try {
    await s3.deleteObject({ Key: key }).promise();
  } catch (e) {
    console.warn('S3 delete failed', e);
  }
}

// ----- UI helpers -----
function esc(s) { return String(s ?? '').replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
function fmtSize(b) { if (!b) return '0 B'; if (b < 1024) return b + ' B'; if (b < 1e6) return (b / 1024).toFixed(1) + ' KB'; return (b / 1e6).toFixed(1) + ' MB'; }

function updateUI() { renderDashboard(); renderProjects(); renderSongs(); renderFiles(); renderSidebarProjects(); updateSelects(); }
function renderDashboard() {
  document.getElementById('dash-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-card-value">${db.projects.length}</div><div class="stat-card-label">Projects</div></div>
    <div class="stat-card"><div class="stat-card-value">${db.songs.length}</div><div class="stat-card-label">Songs</div></div>
    <div class="stat-card"><div class="stat-card-value">${db.files.length}</div><div class="stat-card-label">Files</div></div>
    <div class="stat-card"><div class="stat-card-value">${db.songs.filter(s => s.status === 'done' || s.status === 'released').length}</div><div class="stat-card-label">Finished</div></div>`;
  const recent = [...db.songs].sort((a, b) => b.created - a.created).slice(0, 6);
  document.getElementById('recentList').innerHTML = recent.map(s => `
    <div class="song-row" style="margin-bottom:6px;" onclick="openSongDetail('${s.id}')">
      <span>🎧</span>
      <span><strong>${esc(s.title)}</strong></span>
      <span class="status-badge status-${s.status}">${s.status}</span>
    </div>`).join('') || '<div class="empty-state" style="padding:20px;opacity:0.5;">No songs yet</div>';
}
function renderSidebarProjects() {
  const list = db.projects.map(p => `<div class="project-chip" onclick="filterByProject('${p.id}')"><div class="project-dot" style="background:${p.colour || '#fff'}"></div>${esc(p.name)}</div>`).join('');
  document.getElementById('sidebarProjectsList').innerHTML = `<div class="section-label">PROJECTS</div>${list || '<div style="padding:12px; font-size:0.8rem; opacity:0.5;">none</div>'}`;
}
function filterByProject(id) { navigate('songs'); document.getElementById('filterProjectSelect').value = id; renderSongs(); }
function renderProjects() {
  document.getElementById('projectsGrid').innerHTML = db.projects.map(p => `
    <div class="card" onclick="openProjectDetail('${p.id}')">
      <div style="display:flex;gap:12px;align-items:center">
        <div style="width:12px;height:12px;border-radius:4px;background:${p.colour || '#fff'}"></div>
        <strong style="font-size:1.3rem;">${esc(p.name)}</strong>
      </div>
      <div style="color:var(--text-muted);font-size:0.8rem; margin-top:8px;">${esc(p.genre || 'no genre')}</div>
      <div style="margin-top:16px; display:flex; gap:16px; font-size:0.85rem;">
        <span>📀 ${db.songs.filter(s => s.projectId === p.id).length}</span>
        <span>🎵 ${db.files.filter(f => f.projectId === p.id).length}</span>
      </div>
    </div>`).join('') || '<div class="empty-state" style="grid-column:1/-1; padding:40px; opacity:0.5;">create first project</div>';
}
function renderSongs() {
  const filterProj = document.getElementById('filterProjectSelect')?.value;
  const filterStat = document.getElementById('filterStatusSelect')?.value;
  const search = document.getElementById('songSearch')?.value.toLowerCase();
  let list = db.songs.filter(s => (!filterProj || s.projectId === filterProj) && (!filterStat || s.status === filterStat) && (!search || s.title.toLowerCase().includes(search)));
  document.getElementById('songsListContainer').innerHTML = list.map((s, i) => `
    <div class="song-row" onclick="openSongDetail('${s.id}')">
      <span style="opacity:0.4;">${String(i + 1).padStart(2, '0')}</span>
      <span><strong>${esc(s.title)}</strong></span>
      <span class="song-project">${db.projects.find(p => p.id === s.projectId)?.name || '—'}</span>
      <span class="song-key">${esc(s.key || '-')}</span>
      <span class="song-bpm">${s.bpm || '—'}bpm</span>
      <span class="status-badge status-${s.status}">${s.status}</span>
    </div>`).join('') || '<div class="empty-state" style="padding:24px;opacity:0.5;">no songs</div>';
}
function renderFiles() {
  const projFilter = document.getElementById('filesProjectFilter')?.value;
  const songFilter = document.getElementById('filesSongFilter')?.value;
  let filtered = db.files.filter(f => (!projFilter || f.projectId === projFilter) && (!songFilter || f.songId === songFilter));
  document.getElementById('globalFilesList').innerHTML = filtered.map(f => `
    <div class="file-row">
      <span>🎵</span>
      <span style="flex:1;">${esc(f.filename)}</span>
      <span style="font-size:0.75rem;opacity:0.6;">${fmtSize(f.size)}</span>
      <div style="display:flex; gap:6px;">
        <button class="btn btn-ghost btn-sm" onclick="playFile('${f.id}')">▶</button>
        <button class="btn btn-ghost btn-sm" onclick="downloadFile('${f.id}')">↓</button>
        <button class="btn btn-danger btn-sm" onclick="deleteFileRecord('${f.id}')">✕</button>
      </div>
    </div>`).join('') || '<div class="empty-state" style="padding:24px;opacity:0.5;">no files</div>';
}
function updateSelects() {
  const getVal = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
  const projFilterVal = getVal('filterProjectSelect');
  const filesProjVal = getVal('filesProjectFilter');
  const filesSongVal = getVal('filesSongFilter');
  const songProjVal = getVal('songProjectSelect');

  const projOpts = '<option value="">All Projects</option>' + db.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  document.getElementById('filterProjectSelect').innerHTML = projOpts;
  document.getElementById('filesProjectFilter').innerHTML = projOpts;

  const songOpts = '<option value="">All Songs</option>' + db.songs.map(s => `<option value="${s.id}">${esc(s.title)}</option>`).join('');
  document.getElementById('filesSongFilter').innerHTML = songOpts;

  document.getElementById('songProjectSelect').innerHTML = '<option value="">— none —</option>' + db.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');

  try { if (projFilterVal) document.getElementById('filterProjectSelect').value = projFilterVal; } catch (e) {}
  try { if (filesProjVal) document.getElementById('filesProjectFilter').value = filesProjVal; } catch (e) {}
  try { if (filesSongVal) document.getElementById('filesSongFilter').value = filesSongVal; } catch (e) {}
  try { if (songProjVal) document.getElementById('songProjectSelect').value = songProjVal; } catch (e) {}
}
function navigate(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navItem = document.querySelector(`.nav-item[data-page="${page}"]`);
  if (navItem) navItem.classList.add('active');
  if (page === 'dashboard') renderDashboard();
  if (page === 'projects') renderProjects();
  if (page === 'songs') renderSongs();
  if (page === 'files') renderFiles();
}
async function uploadFiles(files, songId, projectId, progressId) {
  for (let file of files) {
    await uploadFileToS3(file, songId, projectId, progressId);
  }
  renderFiles();
  if (songId && document.getElementById('songDetailModal').classList.contains('open')) openSongDetail(songId);
  if (progressId) setTimeout(() => document.getElementById(progressId).style.width = '0%', 1000);
}

// ----- Custom player controls -----
const audio = document.getElementById('audioPlayer');
const playPauseBtn = document.getElementById('playPauseBtn');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const timeDisplay = document.getElementById('timeDisplay');
const playerBar = document.getElementById('playerBar');

function formatTime(seconds) {
  if (isNaN(seconds)) return '0:00';
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return mins + ':' + (secs < 10 ? '0' : '') + secs;
}

playPauseBtn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
    playPauseBtn.textContent = '⏸';
  } else {
    audio.pause();
    playPauseBtn.textContent = '▶';
  }
});

audio.addEventListener('loadedmetadata', () => {
  timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
  }
});

progressBar.addEventListener('click', (e) => {
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

document.getElementById('closePlayerBtn').addEventListener('click', closePlayer);

async function playFile(id) {
  const f = db.files.find(x => x.id === id);
  if (!f) return;
  const url = await getSignedUrl(f.s3key);
  audio.src = url;
  audio.play();
  playPauseBtn.textContent = '⏸';
  document.getElementById('playerTitle').innerText = f.filename;
  document.getElementById('playerSub').innerText = db.songs.find(s => s.id === f.songId)?.title || '';
  playerBar.classList.add('visible');
  currentAudio = id;
}

function closePlayer() {
  audio.pause();
  audio.src = '';
  playerBar.classList.remove('visible');
  currentAudio = null;
}

async function downloadFile(id) {
  const f = db.files.find(x => x.id === id);
  if (!f) return;
  const url = await getSignedUrl(f.s3key);
  window.open(url);
}

async function deleteFileRecord(id) {
  if (!confirm('Delete this file? It will be removed from S3 as well.')) return;
  const f = db.files.find(x => x.id === id);
  if (f) {
    await deleteS3Object(f.s3key);
    db.files = db.files.filter(x => x.id !== id);
    const saved = await saveNow();
    if (saved) {
      renderFiles();
      toast('File deleted');
      if (currentAudio === id) closePlayer();
    } else {
      db.files.push(f);
      toast('Delete failed', 'error');
    }
  }
}

function openProjectModal(id) {
  editingProjectId = id;
  const p = id ? db.projects.find(x => x.id === id) : null;
  document.getElementById('projName').value = p?.name || '';
  document.getElementById('projGenre').value = p?.genre || '';
  document.getElementById('projColor').value = p?.colour || '#ffffff';
  document.getElementById('projNotes').value = p?.notes || '';
  openModal('projectModal');
}

function saveProject() {
  const name = document.getElementById('projName').value.trim();
  if (!name) return;
  if (editingProjectId) {
    const p = db.projects.find(x => x.id === editingProjectId);
    p.name = name; p.genre = document.getElementById('projGenre').value; p.colour = document.getElementById('projColor').value; p.notes = document.getElementById('projNotes').value;
  } else {
    db.projects.push({ id: uid(), name, genre: document.getElementById('projGenre').value, colour: document.getElementById('projColor').value, notes: document.getElementById('projNotes').value, created: Date.now() });
  }
  saveToS3(); closeModal('projectModal'); updateUI();
}

function openSongModal(id) {
  editingSongId = id;
  const s = id ? db.songs.find(x => x.id === id) : null;
  document.getElementById('songTitle').value = s?.title || '';
  document.getElementById('songProjectSelect').value = s?.projectId || '';
  document.getElementById('songStatusSelect').value = s?.status || 'idea';
  document.getElementById('songBpm').value = s?.bpm || '';
  document.getElementById('songKey').value = s?.key || '';
  document.getElementById('songLyrics').value = s?.lyrics || '';
  document.getElementById('songNotes').value = s?.notes || '';
  openModal('songModal');
}

function saveSong() {
  const title = document.getElementById('songTitle').value.trim();
  if (!title) return;
  const data = {
    title,
    projectId: document.getElementById('songProjectSelect').value || null,
    status: document.getElementById('songStatusSelect').value,
    bpm: parseInt(document.getElementById('songBpm').value) || null,
    key: document.getElementById('songKey').value,
    lyrics: document.getElementById('songLyrics').value,
    notes: document.getElementById('songNotes').value,
    created: Date.now()
  };
  if (editingSongId) {
    Object.assign(db.songs.find(s => s.id === editingSongId), data);
  } else {
    db.songs.push({ id: uid(), ...data });
  }
  saveToS3(); closeModal('songModal'); updateUI();
}

function openSongDetail(id) {
  currentSongId = id;
  const s = db.songs.find(x => x.id === id);
  if (!s) return;
  const files = db.files.filter(f => f.songId === id);
  const proj = db.projects.find(p => p.id === s.projectId);
  document.getElementById('detailTitle').innerText = s.title;
  document.getElementById('songDetailBody').innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
      <div><label style="opacity:0.6; font-size:0.8rem;">Project</label><div>${proj?.name || '—'}</div></div>
      <div><label style="opacity:0.6; font-size:0.8rem;">Status</label><div class="status-badge status-${s.status}">${s.status}</div></div>
      <div><label style="opacity:0.6; font-size:0.8rem;">BPM</label><div>${s.bpm || '—'}</div></div>
      <div><label style="opacity:0.6; font-size:0.8rem;">Key</label><div>${esc(s.key || '—')}</div></div>
    </div>
    ${s.lyrics ? `<div style="margin-top:20px;"><label style="opacity:0.6; font-size:0.8rem;">Lyrics</label><div style="background:#0b0d12; padding:16px; border-radius:16px; margin-top:6px; white-space:pre-wrap;">${esc(s.lyrics)}</div></div>` : ''}
    <div style="margin-top:24px;"><div class="section-label">Audio files</div>${files.map(f => `<div class="file-row"><span>🎵</span><span style="flex:1;">${esc(f.filename)}</span><div><button class="btn btn-ghost btn-sm" onclick="playFile('${f.id}')">▶</button><button class="btn btn-ghost btn-sm" onclick="downloadFile('${f.id}')">↓</button></div></div>`).join('') || '<div style="opacity:0.5; padding:12px;">none</div>'}</div>
    <div class="upload-zone" style="margin-top:20px;">
      <input type="file" multiple accept="audio/*" id="songUploadInput" onchange="handleSongUpload(this, '${id}')">
      <div style="margin-top:8px;">➕ upload for this song</div>
      <div class="upload-progress" style="height:3px; background:#1a1e26; margin-top:12px; border-radius:2px;"><div id="songDetailProgress" style="width:0%;height:100%;background:white; border-radius:2px;"></div></div>
    </div>
    <div style="margin-top:28px;"><button class="btn btn-danger btn-sm" onclick="deleteSong('${id}')">Delete Song</button></div>`;
  document.getElementById('detailEditBtn').onclick = () => { closeModal('songDetailModal'); openSongModal(id); };
  openModal('songDetailModal');
}

function handleSongUpload(input, songId) {
  const files = Array.from(input.files);
  const song = db.songs.find(s => s.id === songId);
  uploadFiles(files, songId, song?.projectId || null, 'songDetailProgress');
}

function deleteSong(id) {
  if (confirm('delete song and all its file references?')) {
    const filesToDelete = db.files.filter(f => f.songId === id);
    Promise.all(filesToDelete.map(f => deleteS3Object(f.s3key)));
    db.songs = db.songs.filter(s => s.id !== id);
    db.files = db.files.filter(f => f.songId !== id);
    saveNow().then(saved => {
      if (saved) {
        closeModal('songDetailModal'); updateUI(); toast('song removed');
      } else {
        toast('Delete failed', 'error');
      }
    });
  }
}

function openProjectDetail(id) {
  currentProjectId = id;
  const p = db.projects.find(x => x.id === id);
  const songs = db.songs.filter(s => s.projectId === id);
  document.getElementById('projDetailTitle').innerText = p.name;
  document.getElementById('projectDetailBody').innerHTML = `
    <p style="opacity:0.8;">${esc(p.notes || '')}</p>
    <div class="section-label" style="margin-top:24px;">Songs</div>
    ${songs.map(s => `<div class="song-row" onclick="openSongDetail('${s.id}')"><span>🎵</span>${esc(s.title)}<span class="status-badge status-${s.status}">${s.status}</span></div>`).join('') || '<div style="opacity:0.5; padding:12px;">no songs</div>'}
    <button class="btn btn-danger btn-sm" style="margin-top:28px;" onclick="deleteProject('${id}')">Delete Project</button>`;
  document.getElementById('projDetailEditBtn').onclick = () => { closeModal('projectDetailModal'); openProjectModal(id); };
  openModal('projectDetailModal');
}

function deleteProject(id) {
  if (confirm('delete project? songs will be unassigned')) {
    db.projects = db.projects.filter(p => p.id !== id);
    db.songs.forEach(s => { if (s.projectId === id) s.projectId = null; });
    saveToS3(); closeModal('projectDetailModal'); updateUI();
  }
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function openModal(id) { document.getElementById(id).classList.add('open'); }

// ----- Pin logic (unchanged) -----
let pinEntry = '';
const pinCode = '137900';
const pinDotsContainer = document.getElementById('pin-dots-container');
for (let i = 0; i < 6; i++) {
  const dot = document.createElement('div');
  dot.className = 'pin-dot';
  dot.id = `pindot${i}`;
  pinDotsContainer.appendChild(dot);
}
function updatePinDots() {
  for (let i = 0; i < 6; i++) {
    document.getElementById(`pindot${i}`).classList.toggle('filled', i < pinEntry.length);
  }
}
function submitPin() {
  if (pinEntry === pinCode) {
    document.getElementById('pin-screen').classList.add('hidden');
    loadFromS3();
  } else {
    document.getElementById('pin-error').innerText = 'wrong code';
    setTimeout(() => {
      pinEntry = '';
      updatePinDots();
      document.getElementById('pin-error').innerText = '';
    }, 700);
  }
}
function pinPress(digit) {
  if (pinEntry.length < 6) {
    pinEntry += digit;
    updatePinDots();
    if (pinEntry.length === 6) submitPin();
  }
}
function pinDelete() {
  pinEntry = pinEntry.slice(0, -1);
  updatePinDots();
}
const keypad = document.getElementById('pin-keypad');
[...'1234567890'].forEach(d => {
  const btn = document.createElement('div');
  btn.className = 'pin-key';
  btn.innerText = d;
  btn.addEventListener('click', () => pinPress(d));
  keypad.appendChild(btn);
});
const delBtn = document.createElement('div');
delBtn.className = 'pin-key';
delBtn.innerText = '⌫';
delBtn.addEventListener('click', pinDelete);
keypad.appendChild(delBtn);
document.addEventListener('keydown', (e) => {
  if (document.getElementById('pin-screen').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') { e.preventDefault(); pinPress(e.key); }
  else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); pinDelete(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (pinEntry.length === 6) submitPin(); }
});

// ----- Global event listeners -----
document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); }));
document.getElementById('globalFileInput').onchange = e => uploadFiles(Array.from(e.target.files), null, null, 'globalProgress');
document.getElementById('globalUploadZone').addEventListener('dragover', e => e.preventDefault());
document.getElementById('globalUploadZone').addEventListener('drop', e => {
  e.preventDefault();
  const files = Array.from(e.dataTransfer.files);
  uploadFiles(files, null, null, 'globalProgress');
});
document.getElementById('songSearch').addEventListener('input', () => renderSongs());
document.getElementById('filterProjectSelect').addEventListener('change', () => renderSongs());
document.getElementById('filterStatusSelect').innerHTML = '<option value="">All</option><option>idea</option><option>wip</option><option>demo</option><option>done</option><option>released</option>';
document.getElementById('filterStatusSelect').addEventListener('change', () => renderSongs());
document.getElementById('filesProjectFilter').addEventListener('change', () => renderFiles());
document.getElementById('filesSongFilter').addEventListener('change', () => renderFiles());
document.querySelectorAll('.nav-item').forEach(n => n.addEventListener('click', () => navigate(n.getAttribute('data-page'))));
document.getElementById('hamburgerBtn').addEventListener('click', () => document.querySelector('.sidebar').classList.toggle('mobile-open'));

// Expose globals
window.openProjectModal = openProjectModal; window.openSongModal = openSongModal;
window.saveProject = saveProject; window.saveSong = saveSong;
window.openSongDetail = openSongDetail; window.playFile = playFile;
window.downloadFile = downloadFile; window.deleteFileRecord = deleteFileRecord;
window.openProjectDetail = openProjectDetail; window.deleteSong = deleteSong;
window.filterByProject = filterByProject; window.navigate = navigate;
window.closeModal = closeModal; window.closePlayer = closePlayer;
window.handleSongUpload = handleSongUpload;
</script>
